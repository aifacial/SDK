org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------
# Acesso ao repositório Maven da AIFacial (https://maven.aifacial.com.br)
#   usuário = login do painel
#   senha   = chave Maven (painel -> Credenciais -> "Gerar chave Maven")
# A chave só aparece quando é gerada. Se não tiver mais, gere uma nova.
# ---------------------------------------------------------------------
aifacialUser=COLE_AQUI_LOGIN_DO_PAINEL
aifacialPassword=COLE_AQUI_CHAVE_MAVEN

